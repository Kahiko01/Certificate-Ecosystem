<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Certificate Ecosystem - Dashboard Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-info {
            background: rgba(30,41,59,0.85);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .role-admin { background: rgba(99,102,241,0.2); color: #818cf8; }
        
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn-purple { background: #8b5cf6; color: white; }
        .btn-purple:hover { background: #7c3aed; transform: translateY(-2px); }
        .btn-logout { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .btn-logout:hover { background: rgba(239,68,68,0.25); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        
        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px; margin-bottom: 30px;
        }
        .stat-box {
            background: rgba(30,41,59,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-box .number { font-size: 28px; font-weight: 800; color: #818cf8; }
        .stat-box .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .dashboard-card {
            background: rgba(30,41,59,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #f8fafc;
            cursor: pointer;
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,102,241,0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .dashboard-card .icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .dashboard-card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .dashboard-card .description { font-size: 12px; color: #94a3b8; margin-bottom: 8px; line-height: 1.4; }
        .dashboard-card .badge {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
        }
        .badge-finance { background: rgba(16,185,129,0.15); color: #34d399; }
        .badge-registry { background: rgba(6,182,212,0.15); color: #22d3ee; }
        .badge-dean { background: rgba(251,146,60,0.15); color: #fb923c; }
        .badge-student { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .badge-admin { background: rgba(99,102,241,0.15); color: #818cf8; }
        .badge-public { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .badge-audit { background: rgba(236,72,153,0.15); color: #f472b6; }
        
        .footer {
            text-align: center; color: #475569; font-size: 14px;
            margin-top: 40px; padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ Certificate Ecosystem</h1>
            <div class="header-right" id="headerRight">
                <span class="user-info" id="userDisplay">👤 Loading...</span>
                <a href="admin_dashboard.html" class="btn btn-primary">⚙️ Admin</a>
                <a href="monitoring_command_center.html" class="btn btn-purple">📊 Audit</a>
                <a href="users_dashboard.html" class="btn btn-secondary">👥 Users</a>
                <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-box"><div class="number" id="totalDashboards">0</div><div class="label">Available Dashboards</div></div>
            <div class="stat-box"><div class="number" id="totalUsers">0</div><div class="label">Users</div></div>
            <div class="stat-box"><div class="number" id="totalCerts">0</div><div class="label">Certificates</div></div>
            <div class="stat-box"><div class="number" id="totalStudents">0</div><div class="label">Students</div></div>
        </div>

        <div class="dashboard-grid" id="dashboardGrid">
            <!-- Dashboards will be loaded here -->
        </div>

        <div class="footer">🎓 University Certificate Ecosystem · All Rights Reserved</div>
    </div>

    <script>
        function getUser() {
            try {
                const data = localStorage.getItem('user');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function getUserRole() {
            const user = getUser();
            return user ? user.role : 'PUBLIC_VERIFIER';
        }

        function getUserName() {
            const user = getUser();
            return user ? user.name || user.username : 'Guest';
        }

        function isSystemAdmin() {
            return getUserRole() === 'SYSTEM_ADMIN';
        }

        // DASHBOARDS - Removed Academic and Certificate Verification
        const allDashboards = [
            {
                icon: '💰',
                name: 'Finance Dashboard',
                description: 'Manage student fees, payments, and financial clearance',
                roles: ['SYSTEM_ADMIN', 'FINANCE_HEAD', 'FINANCE_OFFICER'],
                url: 'finance_dashboard.html',
                badge: 'badge-finance',
                badgeText: 'Finance'
            },
            {
                icon: '📋',
                name: 'Registry Dashboard',
                description: 'Manage student records, registration, and academic tracking',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR', 'REGISTRY_HEAD', 'REGISTRY_OFFICER'],
                url: 'registry_dashboard.html',
                badge: 'badge-registry',
                badgeText: 'Registry'
            },
            {
                icon: '🏫',
                name: "Dean's Dashboard",
                description: 'Department overview, faculty management, and performance analytics',
                roles: ['SYSTEM_ADMIN', 'DEAN'],
                url: 'deans_dashboard.html',
                badge: 'badge-dean',
                badgeText: 'Dean'
            },
            {
                icon: '👨‍🎓',
                name: 'Student Dashboard',
                description: 'View your academic records, certificates, and clearance status',
                roles: ['SYSTEM_ADMIN', 'STUDENT'],
                url: 'student_dashboard.html',
                badge: 'badge-student',
                badgeText: 'Student'
            },
            {
                icon: '🏛️',
                name: 'Unified Dashboard',
                description: 'Central command center with all features',
                roles: ['SYSTEM_ADMIN'],
                url: 'unified_dashboard.html',
                badge: 'badge-admin',
                badgeText: 'Admin Only'
            },
            {
                icon: '📊',
                name: 'Monitoring & Audit',
                description: 'Audit trail, user activity, and system monitoring',
                roles: ['SYSTEM_ADMIN'],
                url: 'monitoring_command_center.html',
                badge: 'badge-audit',
                badgeText: 'Admin Only'
            },
            {
                icon: '🔍',
                name: 'Certificate Verification',
                description: 'Public portal to verify certificate authenticity',
                roles: ['PUBLIC_VERIFIER', 'STUDENT'],  // Not visible to SYSTEM_ADMIN
                url: 'verify_portal.html',
                badge: 'badge-public',
                badgeText: 'Public'
            },
            {
                icon: '📁',
                name: 'Department Inventory',
                description: 'Track files across all departments',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR', 'FINANCE_HEAD', 'DEAN'],
                url: 'department_inventory.html',
                badge: 'badge-registry',
                badgeText: 'Inventory'
            }
        ];

        function hasAccess(role, allowedRoles) {
            if (allowedRoles.includes('*')) return true;
            return allowedRoles.includes(role);
        }

        function renderDashboards() {
            const role = getUserRole();
            const grid = document.getElementById('dashboardGrid');
            const accessible = allDashboards.filter(d => hasAccess(role, d.roles));

            document.getElementById('totalDashboards').textContent = accessible.length;
            document.getElementById('totalUsers').textContent = '42';
            document.getElementById('totalCerts').textContent = '13';
            document.getElementById('totalStudents').textContent = '42';

            grid.innerHTML = accessible.map(d => `
                <a href="${d.url}" class="dashboard-card">
                    <span class="icon">${d.icon}</span>
                    <div class="name">${d.name}</div>
                    <div class="description">${d.description}</div>
                    <span class="badge ${d.badge}">${d.badgeText}</span>
                </a>
            `).join('');
        }

        function updateUserDisplay() {
            const user = getUser();
            const role = getUserRole();
            const name = getUserName();
            document.getElementById('userDisplay').innerHTML = `
                👤 ${name}
                <span class="role-badge role-admin">${role}</span>
            `;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = 'login_with_rbac.html';
            }
        }

        function init() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login_with_rbac.html';
                return;
            }
            updateUserDisplay();
            renderDashboards();
        }

        init();
    </script>
</body>
</html>

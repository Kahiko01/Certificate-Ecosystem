<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Dean's Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255,255,255,0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #6366f1;
            --accent-2: #06b6d4;
            --accent-3: #10b981;
            --accent-4: #f59e0b;
            --accent-5: #ef4444;
            --accent-6: #8b5cf6;
            --accent-7: #ec4899;
            --accent-8: #fb923c;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #fb923c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
            color: white;
        }
        .btn-primary { background: var(--accent-1); }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn-success { background: var(--accent-3); }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-orange { background: var(--accent-8); }
        .btn-orange:hover { background: #ea580c; transform: translateY(-2px); }
        .logout-btn {
            background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 6px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif; font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(239,68,68,0.25); transform: translateY(-2px); }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(16px);
        }
        .card-title {
            font-size: 14px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .card-title .sub { font-size: 11px; font-weight: 400; color: var(--text-secondary); }
        .stats-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 12px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px; text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px); }
        .stat-card .number { font-size: 22px; font-weight: 800; color: var(--accent-8); }
        .stat-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .stat-card .icon { font-size: 18px; display: block; margin-bottom: 2px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .table-wrap { overflow-x: auto; max-height: 300px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 8px 10px; color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--bg-primary); }
        td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tr:hover { background: rgba(255,255,255,0.02); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
        .form-control {
            width: 100%; padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white; font-size: 13px; font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-control::placeholder { color: #64748b; }
        select.form-control { cursor: pointer; }
        select.form-control option { background: #1e293b; }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-info { background: rgba(99,102,241,0.15); color: #818cf8; }
        .badge-success { background: rgba(16,185,129,0.15); color: #10b981; }
        .barcode { font-family: 'Courier New', monospace; font-size: 12px; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .result-box {
            margin-top: 8px; padding: 10px 14px; border-radius: 8px;
            font-size: 12px; display: none; line-height: 1.5;
        }
        .result-box.show { display: block; }
        .result-box.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #10b981; }
        .result-box.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
        .result-box.info { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #818cf8; }
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .mt-8 { margin-top: 8px; }
        .text-muted { color: #94a3b8; font-size: 11px; }
        .text-center { text-align: center; }
        .chart-container { position: relative; height: 180px; }
        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 992px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏫 Dean's Dashboard</h1>
            <div class="header-right">
                <span id="userDisplay" style="color:#94a3b8;font-size:13px;">👤 Loading...</span>
                <span class="badge badge-online" style="color:#10b981;">● Online</span>
                <span class="text-muted" id="lastUpdate"></span>
                <button class="btn btn-secondary btn-sm" onclick="refreshAll()">🔄</button>
                <button class="btn btn-secondary btn-sm" onclick="scrollToInventory()">📁 Inventory</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><span class="icon">👨‍🎓</span><span class="number" id="totalStudents">-</span><div class="label">Total Students</div></div>
            <div class="stat-card"><span class="icon">🏫</span><span class="number" id="totalDepts">-</span><div class="label">Departments</div></div>
            <div class="stat-card"><span class="icon">👨‍🏫</span><span class="number" id="totalFaculty">-</span><div class="label">Faculty</div></div>
            <div class="stat-card"><span class="icon">📊</span><span class="number" id="avgGPA">-</span><div class="label">Avg GPA</div></div>
            <div class="stat-card"><span class="icon">✅</span><span class="number" id="passingRate">-</span><div class="label">Passing Rate</div></div>
        </div>

        <!-- Charts -->
        <div class="grid-2">
            <div class="card">
                <div class="card-title">📊 Department Performance</div>
                <div class="chart-container"><canvas id="deptChart"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">📈 GPA Distribution</div>
                <div class="chart-container"><canvas id="gpaChart"></canvas></div>
            </div>
        </div>

        <!-- ===== INVENTORY SECTION ===== -->
        <div class="card" id="inventorySection">
            <div class="card-title">
                📁 Dean's Office File Inventory
                <span class="sub" id="deanInventoryCount">0 files</span>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>File Name</label>
                    <input class="form-control" type="text" id="deanFileName" placeholder="Enter file name">
                </div>
                <div class="form-group">
                    <label>File Number</label>
                    <input class="form-control" type="text" id="deanFileNumber" placeholder="e.g., DEAN-2026-001">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" id="deanFileCategory">
                        <option value="Student Records">Student Records</option>
                        <option value="Academic Reports">Academic Reports</option>
                        <option value="Disciplinary">Disciplinary</option>
                        <option value="Correspondence">Correspondence</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cabinet Location</label>
                    <input class="form-control" type="text" id="deanFileLocation" placeholder="e.g., Cabinet D, Shelf 3">
                </div>
            </div>
            <button class="btn btn-orange btn-sm" onclick="addDeanInventory()">📁 Add File</button>
            <div id="deanInventoryResult" class="result-box"></div>
            
            <div class="table-wrap" style="margin-top:12px;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>File Name</th>
                            <th>File Number</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="deanInventoryTable">
                        <tr><td colspan="7" class="text-center text-muted">No files added yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function getUser() {
            try {
                const data = localStorage.getItem('user');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = 'login_with_rbac.html';
            }
        }

        function refreshAll() {
            document.getElementById('lastUpdate').textContent = '🕐 ' + new Date().toLocaleTimeString();
            loadDeanInventory();
        }

        function scrollToInventory() {
            const el = document.getElementById('inventorySection');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        // ===== DEAN'S INVENTORY =====
        let deanInventory = [];
        let deanNextId = 1;

        // Sample data
        const sampleDeanInventory = [
            { id: 1, name: 'Student Academic Records 2024', number: 'DEAN-2024-001', category: 'Student Records', location: 'Cabinet D, Shelf 1', status: 'Active' },
            { id: 2, name: 'Department Performance Reports', number: 'DEAN-2024-002', category: 'Academic Reports', location: 'Cabinet D, Shelf 2', status: 'Active' },
            { id: 3, name: 'Disciplinary Case Files 2024', number: 'DEAN-2024-003', category: 'Disciplinary', location: 'Cabinet D, Shelf 3', status: 'Active' },
            { id: 4, name: 'Faculty Meeting Minutes', number: 'DEAN-2024-004', category: 'Correspondence', location: 'Cabinet D, Shelf 4', status: 'Active' },
            { id: 5, name: 'Student Appeals 2024', number: 'DEAN-2024-005', category: 'Student Records', location: 'Cabinet D, Shelf 5', status: 'Active' },
        ];

        function loadDeanInventory() {
            const saved = localStorage.getItem('inventory_dean');
            if (saved) {
                try {
                    deanInventory = JSON.parse(saved);
                    deanNextId = deanInventory.length + 1;
                } catch(e) { deanInventory = []; }
            } else {
                // Load sample data
                localStorage.setItem('inventory_dean', JSON.stringify(sampleDeanInventory));
                deanInventory = sampleDeanInventory;
                deanNextId = deanInventory.length + 1;
            }
            renderDeanInventory();
        }

        function renderDeanInventory() {
            const tbody = document.getElementById('deanInventoryTable');
            const count = document.getElementById('deanInventoryCount');
            
            if (deanInventory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No files added yet</td></tr>';
                if (count) count.textContent = '0 files';
                return;
            }
            
            if (count) count.textContent = `${deanInventory.length} files`;
            
            tbody.innerHTML = deanInventory.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${item.name}</strong></td>
                    <td><span class="barcode">${item.number}</span></td>
                    <td><span class="badge badge-info">${item.category}</span></td>
                    <td>${item.location}</td>
                    <td><span class="badge badge-success">Active</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editDeanItem(${item.id})">✏️</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteDeanItem(${item.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function addDeanInventory() {
            const name = document.getElementById('deanFileName').value.trim();
            const number = document.getElementById('deanFileNumber').value.trim();
            const category = document.getElementById('deanFileCategory').value;
            const location = document.getElementById('deanFileLocation').value.trim();
            const resultDiv = document.getElementById('deanInventoryResult');

            if (!name || !number || !location) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Please fill in all fields';
                return;
            }

            deanInventory.push({
                id: deanNextId++,
                name: name,
                number: number,
                category: category,
                location: location,
                status: 'Active',
                dateAdded: new Date().toISOString().split('T')[0]
            });

            localStorage.setItem('inventory_dean', JSON.stringify(deanInventory));
            renderDeanInventory();
            
            document.getElementById('deanFileName').value = '';
            document.getElementById('deanFileNumber').value = '';
            document.getElementById('deanFileLocation').value = '';

            resultDiv.className = 'result-box show success';
            resultDiv.textContent = `✅ File "${name}" added successfully!`;
            setTimeout(() => resultDiv.className = 'result-box', 3000);
        }

        function deleteDeanItem(id) {
            if (confirm('Are you sure you want to delete this file?')) {
                deanInventory = deanInventory.filter(item => item.id !== id);
                localStorage.setItem('inventory_dean', JSON.stringify(deanInventory));
                renderDeanInventory();
                showDeanResult('deanInventoryResult', 'success', '🗑️ File removed');
            }
        }

        function editDeanItem(id) {
            const item = deanInventory.find(i => i.id === id);
            if (!item) return;
            
            const newName = prompt('File Name:', item.name);
            if (newName) item.name = newName;
            
            const newNumber = prompt('File Number:', item.number);
            if (newNumber) item.number = newNumber;
            
            const newLocation = prompt('Location:', item.location);
            if (newLocation) item.location = newLocation;
            
            localStorage.setItem('inventory_dean', JSON.stringify(deanInventory));
            renderDeanInventory();
            showDeanResult('deanInventoryResult', 'success', '✅ File updated');
        }

        function showDeanResult(id, type, message) {
            const resultDiv = document.getElementById(id);
            resultDiv.className = `result-box show ${type}`;
            resultDiv.textContent = message;
            setTimeout(() => resultDiv.className = 'result-box', 3000);
        }

        // ===== CHARTS =====
        function loadCharts() {
            // Department Performance Chart
            const ctx1 = document.getElementById('deptChart').getContext('2d');
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['Finance', 'Registry', 'Academic', 'Discipline'],
                    datasets: [{
                        label: 'Performance',
                        data: [85, 92, 78, 88],
                        backgroundColor: ['#818cf8', '#34d399', '#f59e0b', '#f472b6'],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // GPA Distribution Chart
            const ctx2 = document.getElementById('gpaChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['3.5-4.0', '3.0-3.4', '2.5-2.9', '2.0-2.4', 'Below 2.0'],
                    datasets: [{
                        data: [18, 22, 25, 20, 15],
                        backgroundColor: ['#10b981', '#818cf8', '#f59e0b', '#f472b6', '#ef4444'],
                        borderColor: '#0f172a',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 10, usePointStyle: true } }
                    },
                    cutout: '65%'
                }
            });
        }

        // ===== INIT =====
        function init() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login_with_rbac.html';
                return;
            }
            const user = getUser();
            document.getElementById('userDisplay').textContent = `👤 ${user ? user.name || user.username : 'User'}`;
            
            // Stats
            document.getElementById('totalStudents').textContent = '42';
            document.getElementById('totalDepts').textContent = '5';
            document.getElementById('totalFaculty').textContent = '24';
            document.getElementById('avgGPA').textContent = '3.2';
            document.getElementById('passingRate').textContent = '78%';
            
            loadDeanInventory();
            loadCharts();
            document.getElementById('lastUpdate').textContent = '🕐 ' + new Date().toLocaleTimeString();
        }

        init();
    </script>
</body>
</html>

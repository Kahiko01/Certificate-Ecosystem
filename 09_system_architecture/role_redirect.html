<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text { color: #94a3b8; font-size: 16px; }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
        }
        .badge-admin { background: rgba(99,102,241,0.2); color: #818cf8; }
        .badge-registrar { background: rgba(6,182,212,0.2); color: #22d3ee; }
        .badge-finance { background: rgba(16,185,129,0.2); color: #34d399; }
        .badge-academic { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .badge-dean { background: rgba(251,146,60,0.2); color: #fb923c; }
        .badge-student { background: rgba(148,163,184,0.2); color: #94a3b8; }
        .badge-other { background: rgba(148,163,184,0.2); color: #94a3b8; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div id="roleDisplay"></div>

    <script>
        function getUser() {
            try {
                const data = localStorage.getItem('user');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function getRoleBadgeClass(role) {
            const map = {
                'SYSTEM_ADMIN': 'badge-admin',
                'REGISTRAR': 'badge-registrar',
                'FINANCE_HEAD': 'badge-finance',
                'FINANCE_OFFICER': 'badge-finance',
                'ACADEMIC_HEAD': 'badge-academic',
                'ACADEMIC_OFFICER': 'badge-academic',
                'LIBRARY_HEAD': 'badge-other',
                'LIBRARY_OFFICER': 'badge-other',
                'ACCOMMODATION_HEAD': 'badge-other',
                'ACCOMMODATION_OFFICER': 'badge-other',
                'DISCIPLINE_HEAD': 'badge-other',
                'DISCIPLINE_OFFICER': 'badge-other',
                'REGISTRY_HEAD': 'badge-registrar',
                'REGISTRY_OFFICER': 'badge-registrar',
                'SENATE_HEAD': 'badge-other',
                'SENATE_OFFICER': 'badge-other',
                'DEAN': 'badge-dean',
                'STUDENT': 'badge-student',
                'AUDITOR': 'badge-admin'
            };
            return map[role] || 'badge-other';
        }

        function getRoleDisplayName(role) {
            const map = {
                'SYSTEM_ADMIN': 'System Administrator',
                'REGISTRAR': 'Registrar',
                'FINANCE_HEAD': 'Finance Head',
                'FINANCE_OFFICER': 'Finance Officer',
                'ACADEMIC_HEAD': 'Academic Head',
                'ACADEMIC_OFFICER': 'Academic Officer',
                'LIBRARY_HEAD': 'Library Head',
                'LIBRARY_OFFICER': 'Library Officer',
                'ACCOMMODATION_HEAD': 'Accommodation Head',
                'ACCOMMODATION_OFFICER': 'Accommodation Officer',
                'DISCIPLINE_HEAD': 'Discipline Head',
                'DISCIPLINE_OFFICER': 'Discipline Officer',
                'REGISTRY_HEAD': 'Registry Head',
                'REGISTRY_OFFICER': 'Registry Officer',
                'SENATE_HEAD': 'Senate Head',
                'SENATE_OFFICER': 'Senate Officer',
                'DEAN': 'Dean',
                'STUDENT': 'Student',
                'AUDITOR': 'Auditor'
            };
            return map[role] || role;
        }

        function redirectToDashboard() {
            const user = getUser();
            if (!user) {
                window.location.href = 'login_with_rbac.html';
                return;
            }

            const role = user.role;
            const roleDisplay = getRoleDisplayName(role);
            const badgeClass = getRoleBadgeClass(role);

            document.getElementById('roleDisplay').innerHTML = `
                <span class="role-badge ${badgeClass}">${roleDisplay}</span>
            `;

            // Role to dashboard mapping (department-specific)
            const roleMap = {
                'SYSTEM_ADMIN': 'unified_dashboard.html',
                'REGISTRAR': 'registry_dashboard.html',
                'FINANCE_HEAD': 'finance_dashboard.html',
                'FINANCE_OFFICER': 'finance_dashboard.html',
                'ACADEMIC_HEAD': 'academic_dashboard.html',
                'ACADEMIC_OFFICER': 'academic_dashboard.html',
                'LIBRARY_HEAD': 'dashboard_hub.html',
                'LIBRARY_OFFICER': 'dashboard_hub.html',
                'ACCOMMODATION_HEAD': 'dashboard_hub.html',
                'ACCOMMODATION_OFFICER': 'dashboard_hub.html',
                'DISCIPLINE_HEAD': 'dashboard_hub.html',
                'DISCIPLINE_OFFICER': 'dashboard_hub.html',
                'REGISTRY_HEAD': 'registry_dashboard.html',
                'REGISTRY_OFFICER': 'registry_dashboard.html',
                'SENATE_HEAD': 'dashboard_hub.html',
                'SENATE_OFFICER': 'dashboard_hub.html',
                'DEAN': 'deans_dashboard.html',
                'STUDENT': 'student_dashboard.html',
                'AUDITOR': 'monitoring_dashboard.html'
            };

            const dashboard = roleMap[role] || 'dashboard_hub.html';
            
            setTimeout(() => {
                window.location.href = dashboard;
            }, 1500);
        }

        redirectToDashboard();
    </script>
</body>
</html>
<script>
// Add inventory to registrar's dashboard options
const registrarDashboards = [
    'registry_dashboard.html',
    'certificate_inventory.html',
    'dashboard_hub.html'
];

function getRegistrarDashboard() {
    // Check if user wants to go to inventory
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target');
    if (target === 'inventory') {
        return 'certificate_inventory.html';
    }
    return 'registry_dashboard.html';
}
</script>

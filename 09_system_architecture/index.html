<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Certificate Ecosystem - Central Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255,255,255,0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #6366f1;
            --accent-2: #06b6d4;
            --accent-3: #10b981;
            --accent-4: #f59e0b;
            --accent-5: #ef4444;
            --accent-6: #8b5cf6;
            --accent-7: #ec4899;
            --accent-8: #fb923c;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        
        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .user-badge {
            background: rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .role-admin { background: rgba(99,102,241,0.2); color: #818cf8; }
        .role-registrar { background: rgba(6,182,212,0.2); color: #22d3ee; }
        .role-finance { background: rgba(16,185,129,0.2); color: #34d399; }
        .role-dean { background: rgba(251,146,60,0.2); color: #fb923c; }
        .role-student { background: rgba(148,163,184,0.2); color: #94a3b8; }
        .role-academic { background: rgba(245,158,11,0.2); color: #fbbf24; }
        
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-logout {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .btn-logout:hover { background: rgba(239,68,68,0.25); transform: translateY(-2px); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        
        /* Stats */
        .stats-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px; text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px); }
        .stat-card .number { font-size: 20px; font-weight: 800; color: var(--accent-1); }
        .stat-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .stat-card .icon { font-size: 18px; display: block; margin-bottom: 2px; }
        
        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .dashboard-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,102,241,0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .dashboard-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .dashboard-card.locked:hover { transform: none; border-color: var(--border-color); }
        .dashboard-card .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .dashboard-card .name { font-size: 13px; font-weight: 600; }
        .dashboard-card .desc { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .dashboard-card .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 9px; font-weight: 600; margin-top: 6px;
        }
        .badge-all { background: rgba(99,102,241,0.15); color: #818cf8; }
        .badge-admin { background: rgba(99,102,241,0.2); color: #818cf8; }
        .badge-finance { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge-registry { background: rgba(6,182,212,0.2); color: #22d3ee; }
        .badge-academic { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-dean { background: rgba(251,146,60,0.2); color: #fb923c; }
        .badge-student { background: rgba(148,163,184,0.2); color: #94a3b8; }
        .badge-audit { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .badge-inventory { background: rgba(236,72,153,0.2); color: #f472b6; }
        
        .section-title {
            font-size: 16px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .section-title .sub { font-size: 12px; font-weight: 400; color: var(--text-secondary); }
        
        .footer {
            text-align: center; color: #475569; font-size: 13px;
            margin-top: 20px; padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; align-items: flex-start; }
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        
        .lock-icon { font-size: 12px; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏛️ Certificate Ecosystem</h1>
            <div class="header-right">
                <span class="user-badge" id="userDisplay">
                    👤 Loading...
                    <span class="role-badge" id="roleDisplay">Role</span>
                </span>
                <button class="btn btn-secondary" onclick="refreshAll()">🔄</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><span class="icon">📜</span><span class="number" id="totalCerts">-</span><div class="label">Certificates</div></div>
            <div class="stat-card"><span class="icon">👨‍🎓</span><span class="number" id="totalStudents">-</span><div class="label">Students</div></div>
            <div class="stat-card"><span class="icon">📁</span><span class="number" id="totalFiles">-</span><div class="label">Files</div></div>
            <div class="stat-card"><span class="icon">🏛️</span><span class="number" id="totalDepts">-</span><div class="label">Departments</div></div>
            <div class="stat-card"><span class="icon">📊</span><span class="number" id="totalEvents">-</span><div class="label">Events</div></div>
        </div>

        <!-- ALL DASHBOARDS -->
        <div class="section-title">
            📊 ALL DASHBOARDS
            <span class="sub">Role-based access</span>
        </div>
        <div class="dashboard-grid" id="dashboardGrid"></div>

        <!-- ADMIN SECTION (Only visible to System Admin) -->
        <div id="adminSection" style="display:none;">
            <div class="section-title">
                ⚙️ ADMIN & MONITORING
                <span class="sub">System Administration</span>
            </div>
            <div class="dashboard-grid" id="adminGrid"></div>
        </div>

        <div class="footer">🎓 University Certificate Ecosystem · All Rights Reserved</div>
    </div>

    <script>
        // ===== USER FUNCTIONS =====
        function getUser() {
            try {
                const data = localStorage.getItem('user');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function getUserRole() {
            const user = getUser();
            return user ? user.role : 'PUBLIC_VERIFIER';
        }

        function getUserName() {
            const user = getUser();
            return user ? user.name || user.username : 'Guest';
        }

        function isSystemAdmin() {
            return getUserRole() === 'SYSTEM_ADMIN';
        }

        function getRoleBadgeClass(role) {
            const map = {
                'SYSTEM_ADMIN': 'role-admin',
                'REGISTRAR': 'role-registrar',
                'FINANCE_HEAD': 'role-finance',
                'FINANCE_OFFICER': 'role-finance',
                'ACADEMIC_HEAD': 'role-academic',
                'ACADEMIC_OFFICER': 'role-academic',
                'DEAN': 'role-dean',
                'STUDENT': 'role-student'
            };
            return map[role] || 'role-student';
        }

        function getRoleDisplayName(role) {
            const map = {
                'SYSTEM_ADMIN': 'System Admin',
                'REGISTRAR': 'Registrar',
                'FINANCE_HEAD': 'Finance Head',
                'FINANCE_OFFICER': 'Finance Officer',
                'ACADEMIC_HEAD': 'Academic Head',
                'ACADEMIC_OFFICER': 'Academic Officer',
                'DEAN': 'Dean',
                'STUDENT': 'Student'
            };
            return map[role] || role;
        }

        function hasAccess(role, allowedRoles) {
            if (allowedRoles.includes('*')) return true;
            return allowedRoles.includes(role);
        }

        // ===== DASHBOARD DEFINITIONS =====
        const allDashboards = [
            // Main Dashboards
            {
                id: 'clearance',
                icon: '🔍',
                name: 'Clearance Workflow',
                desc: 'Student clearance management',
                url: 'clearance_workflow_secure.html',
                badge: 'badge-all',
                badgeText: 'All Roles',
                roles: ['*']
            },
            {
                id: 'unified',
                icon: '🏛️',
                name: 'Unified Dashboard',
                desc: 'Central command center',
                url: 'unified_dashboard.html',
                badge: 'badge-admin',
                badgeText: 'Admin/Registrar',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR']
            },
            {
                id: 'registry',
                icon: '📋',
                name: 'Registry Dashboard',
                desc: 'Student records & certificates',
                url: 'registry_dashboard.html',
                badge: 'badge-registry',
                badgeText: 'Registry',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR', 'REGISTRY_HEAD', 'REGISTRY_OFFICER']
            },
            {
                id: 'finance',
                icon: '💰',
                name: 'Finance Dashboard',
                desc: 'Fee management & clearance',
                url: 'finance_dashboard.html',
                badge: 'badge-finance',
                badgeText: 'Finance',
                roles: ['SYSTEM_ADMIN', 'FINANCE_HEAD', 'FINANCE_OFFICER']
            },
            {
                id: 'academic',
                icon: '📚',
                name: 'Academic Dashboard',
                desc: 'Academic performance tracking',
                url: 'academic_dashboard.html',
                badge: 'badge-academic',
                badgeText: 'Academic',
                roles: ['SYSTEM_ADMIN', 'ACADEMIC_HEAD', 'ACADEMIC_OFFICER']
            },
            {
                id: 'deans',
                icon: '🏫',
                name: 'Dean\'s Dashboard',
                desc: 'Department overview & analytics',
                url: 'deans_dashboard.html',
                badge: 'badge-dean',
                badgeText: 'Dean',
                roles: ['SYSTEM_ADMIN', 'DEAN']
            },
            {
                id: 'student',
                icon: '👨‍🎓',
                name: 'Student Dashboard',
                desc: 'View your records & certificates',
                url: 'student_dashboard.html',
                badge: 'badge-student',
                badgeText: 'Student',
                roles: ['SYSTEM_ADMIN', 'STUDENT']
            },
            {
                id: 'inventory',
                icon: '📁',
                name: 'Department Inventory',
                desc: 'Track files across departments',
                url: 'department_inventory.html',
                badge: 'badge-inventory',
                badgeText: 'Inventory',
                roles: ['*']
            },
            {
                id: 'certificate_view',
                icon: '🎓',
                name: 'Student Certificate View',
                desc: 'View your certificates',
                url: 'student_certificate_view.html',
                badge: 'badge-student',
                badgeText: 'Student',
                roles: ['SYSTEM_ADMIN', 'STUDENT']
            },
            {
                id: 'certificate_template',
                icon: '📄',
                name: 'Certificate Template',
                desc: 'Generate certificate preview',
                url: 'certificate_template.html',
                badge: 'badge-registry',
                badgeText: 'Registry',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR']
            }
        ];

        // Admin-Only Dashboards
        const adminDashboards = [
            {
                id: 'audit',
                icon: '🔍',
                name: 'Audit & Monitoring',
                desc: 'Track all system activities',
                url: 'audit_monitoring_system.html',
                badge: 'badge-audit',
                badgeText: 'Audit'
            },
            {
                id: 'admin_panel',
                icon: '⚙️',
                name: 'Admin Dashboard',
                desc: 'System administration',
                url: 'admin_dashboard.html',
                badge: 'badge-admin',
                badgeText: 'Admin'
            },
            {
                id: 'telemetry',
                icon: '📊',
                name: 'Telemetry Dashboard',
                desc: 'System metrics & monitoring',
                url: 'telemetry_dashboard.html',
                badge: 'badge-audit',
                badgeText: 'Telemetry'
            },
            {
                id: 'users',
                icon: '👥',
                name: 'Users Dashboard',
                desc: 'User management',
                url: 'users_dashboard.html',
                badge: 'badge-admin',
                badgeText: 'Users'
            },
            {
                id: 'service_status',
                icon: '📈',
                name: 'Service Status',
                desc: 'Monitor system services',
                url: 'service_status.html',
                badge: 'badge-audit',
                badgeText: 'Monitoring'
            },
            {
                id: 'login_monitoring',
                icon: '🔐',
                name: 'Login Monitoring',
                desc: 'User session tracking',
                url: 'login_monitoring.html',
                badge: 'badge-audit',
                badgeText: 'Security'
            }
        ];

        // ===== RENDER FUNCTIONS =====
        function renderDashboards() {
            const role = getUserRole();
            const grid = document.getElementById('dashboardGrid');

            // Filter dashboards based on role
            const accessible = allDashboards.filter(d => hasAccess(role, d.roles));
            const locked = allDashboards.filter(d => !hasAccess(role, d.roles));

            let html = accessible.map(d => `
                <a href="${d.url}" class="dashboard-card">
                    <span class="icon">${d.icon}</span>
                    <div class="name">${d.name}</div>
                    <div class="desc">${d.desc}</div>
                    <span class="badge ${d.badge}">${d.badgeText}</span>
                </a>
            `).join('');

            html += locked.map(d => `
                <div class="dashboard-card locked">
                    <span class="icon">${d.icon}</span>
                    <div class="name">${d.name} 🔒</div>
                    <div class="desc">${d.desc}</div>
                    <span class="badge ${d.badge}">🔒 Locked</span>
                </div>
            `).join('');

            grid.innerHTML = html;

            // Admin Section
            const adminSection = document.getElementById('adminSection');
            const adminGrid = document.getElementById('adminGrid');
            
            if (isSystemAdmin()) {
                adminSection.style.display = 'block';
                adminGrid.innerHTML = adminDashboards.map(d => `
                    <a href="${d.url}" class="dashboard-card">
                        <span class="icon">${d.icon}</span>
                        <div class="name">${d.name}</div>
                        <div class="desc">${d.desc}</div>
                        <span class="badge ${d.badge}">${d.badgeText}</span>
                    </a>
                `).join('');
            } else {
                adminSection.style.display = 'none';
            }
        }

        // ===== STATS =====
        function updateStats() {
            // Get stats from localStorage or generate sample
            const stats = {
                certificates: localStorage.getItem('totalCerts') || '246',
                students: localStorage.getItem('totalStudents') || '156',
                files: localStorage.getItem('totalFiles') || '89',
                departments: '7',
                events: localStorage.getItem('totalEvents') || '1,247'
            };
            
            document.getElementById('totalCerts').textContent = stats.certificates;
            document.getElementById('totalStudents').textContent = stats.students;
            document.getElementById('totalFiles').textContent = stats.files;
            document.getElementById('totalDepts').textContent = stats.departments;
            document.getElementById('totalEvents').textContent = stats.events;
        }

        // ===== USER INTERFACE =====
        function updateUserDisplay() {
            const user = getUser();
            const role = getUserRole();
            const name = getUserName();
            const roleDisplay = getRoleDisplayName(role);
            const badgeClass = getRoleBadgeClass(role);

            document.getElementById('userDisplay').innerHTML = `
                👤 ${name}
                <span class="role-badge ${badgeClass}">${roleDisplay}</span>
            `;
        }

        // ===== LOGOUT =====
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = 'login_with_rbac.html';
            }
        }

        // ===== REFRESH =====
        function refreshAll() {
            renderDashboards();
            updateStats();
            document.getElementById('lastUpdate').textContent = '🕐 ' + new Date().toLocaleTimeString();
        }

        // ===== INIT =====
        function init() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login_with_rbac.html';
                return;
            }
            updateUserDisplay();
            renderDashboards();
            updateStats();
            document.getElementById('lastUpdate').textContent = '🕐 ' + new Date().toLocaleTimeString();
        }

        init();
    </script>
</body>
</html>

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'certificate-services'
    static_configs:
      - targets:
        - 'certificate-service:8000'
        
  - job_name: 'postgres'
    static_configs:
      - targets:
        - 'postgres:9187'  # PostgreSQL exporter port

  - job_name: 'redis'
    static_configs:
      - targets:
        - 'redis:9121'  # Redis exporter port

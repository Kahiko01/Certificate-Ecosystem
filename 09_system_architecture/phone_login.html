<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 Phone Login - Certificate Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%);
            padding: 20px;
        }
        .login-container { max-width: 420px; width: 100%; }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header .logo { font-size: 48px; display: block; margin-bottom: 8px; }
        .login-header h1 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-header p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #e2e8f0;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: white; font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .form-group select option { background: #1e293b; }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none; border-radius: 12px;
            color: white; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
        .error-message {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
        .error-message.show { display: block; }
        .quick-login {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .quick-login-title {
            font-size: 11px; color: #64748b; text-align: center;
            margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .quick-login-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
        }
        .quick-login-btn {
            padding: 6px 8px; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px; background: rgba(0,0,0,0.2);
            color: #94a3b8; font-size: 10px; cursor: pointer; transition: all 0.2s;
            text-align: center; font-family: 'Inter', sans-serif;
        }
        .quick-login-btn:hover {
            background: rgba(99,102,241,0.1); border-color: #6366f1; color: white;
        }
        .quick-login-btn .emoji { font-size: 14px; display: block; }
        .login-footer {
            text-align: center; margin-top: 20px; color: #64748b; font-size: 12px;
        }
        @media (max-width: 480px) {
            .login-card { padding: 24px; }
            .quick-login-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="logo">📱</span>
                <h1>Certificate Ecosystem</h1>
                <p>Phone Access - Sign in with your role</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">🔐 Sign In</button>
            </form>

            <div class="quick-login">
                <div class="quick-login-title">⚡ Quick Access</div>
                <div class="quick-login-grid">
                    <button class="quick-login-btn" onclick="quickLogin('system_admin', 'admin_hash')">
                        <span class="emoji">⚙️</span>Admin
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('registrar', 'default_hash')">
                        <span class="emoji">📋</span>Registrar
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('finance_head', 'default_hash')">
                        <span class="emoji">💰</span>Finance
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('dean', 'default_hash')">
                        <span class="emoji">🏫</span>Dean
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('student1', 'default_hash')">
                        <span class="emoji">👨‍🎓</span>Student
                    </button>
                </div>
            </div>

            <div class="login-footer">🔒 Secure login · Certificate Ecosystem</div>
        </div>
    </div>

    <script>
        // Use the network IP for auth (detected from server)
        const WIN_IP = '172.26.80.1';
        const API_AUTH = `http://${WIN_IP}:8001`;

        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');
            
            errorEl.className = 'error-message';
            errorEl.textContent = '';
            
            if (!username || !password) {
                errorEl.className = 'error-message show';
                errorEl.textContent = 'Please enter username and password';
                return;
            }
            
            btn.textContent = '⏳ Signing in...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_AUTH}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard_hub.html';
                } else {
                    errorEl.className = 'error-message show';
                    errorEl.textContent = data.detail || 'Invalid credentials';
                }
            } catch (err) {
                errorEl.className = 'error-message show';
                errorEl.textContent = 'Connection error. Make sure the server is running.';
                console.error('Login error:', err);
            } finally {
                btn.textContent = '🔐 Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

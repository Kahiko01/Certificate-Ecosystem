<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Student Self-Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.1) 0%, transparent 50%);
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header .logo { font-size: 48px; display: block; margin-bottom: 10px; }
        .header h1 {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #94a3b8; font-size: 16px; margin-top: 8px; }
        
        .card {
            background: rgba(30,41,59,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px; font-weight: 700;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            font-weight: 600; font-size: 13px;
            color: #94a3b8;
        }
        .form-control {
            width: 100%; padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white; font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .form-control::placeholder { color: #64748b; }
        select.form-control { cursor: pointer; }
        select.form-control option { background: #1e293b; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.3s;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            width: 100%;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.3);
        }
        .result-box {
            margin-top: 16px; padding: 16px; border-radius: 10px;
            font-size: 14px; display: none; line-height: 1.5;
        }
        .result-box.show { display: block; }
        .result-box.success {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.2);
            color: #10b981;
        }
        .result-box.error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
        }
        .result-box.info {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.2);
            color: #818cf8;
        }
        .footer {
            text-align: center; color: #475569; font-size: 13px;
            margin-top: 30px;
        }
        .login-link {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">📝</span>
            <h1>Student Self-Registration</h1>
            <p>Create your account to track your academic progress and certificates</p>
        </div>

        <div class="card">
            <div class="card-title">📋 Personal Information</div>
            <form id="registrationForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label>First Name</label>
                        <input class="form-control" type="text" id="firstName" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input class="form-control" type="text" id="lastName" placeholder="Enter last name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Student Number</label>
                    <input class="form-control" type="text" id="studentNumber" placeholder="e.g., S2024001" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input class="form-control" type="email" id="email" placeholder="Enter your university email" required>
                </div>
                <div class="form-group">
                    <label>Programme</label>
                    <select class="form-control" id="programme" required>
                        <option value="">Select your programme</option>
                        <option value="BSc Computer Science">BSc Computer Science</option>
                        <option value="BSc Business">BSc Business</option>
                        <option value="BSc Engineering">BSc Engineering</option>
                        <option value="BSc Medicine">BSc Medicine</option>
                        <option value="LLB Law">LLB Law</option>
                        <option value="BSc Education">BSc Education</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Academic Year</label>
                    <select class="form-control" id="academicYear" required>
                        <option value="">Select year</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Create Username</label>
                        <input class="form-control" type="text" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input class="form-control" type="password" id="password" placeholder="Create a strong password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input class="form-control" type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <div class="form-group" style="margin-top:20px;">
                    <button type="submit" class="btn btn-primary">📝 Register Student</button>
                </div>
            </form>
            <div id="registrationResult" class="result-box"></div>
        </div>

        <div class="card">
            <div class="card-title">🔍 Already Registered?</div>
            <div style="text-align:center;padding:10px;">
                <p style="color:#94a3b8;">If you already have an account, please login.</p>
                <br>
                <a href="login_with_rbac.html" class="btn btn-success" style="display:inline-block;width:auto;padding:12px 40px;text-decoration:none;">🔐 Login Here</a>
            </div>
        </div>

        <div class="footer">🎓 Certificate Ecosystem · Student Registration Portal</div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const studentNumber = document.getElementById('studentNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const programme = document.getElementById('programme').value;
            const academicYear = document.getElementById('academicYear').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultDiv = document.getElementById('registrationResult');
            
            // Validation
            if (!firstName || !lastName || !studentNumber || !email || !programme || !academicYear || !username || !password) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Please fill in all fields';
                return;
            }
            
            if (password !== confirmPassword) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Passwords do not match';
                return;
            }
            
            if (password.length < 8) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Password must be at least 8 characters';
                return;
            }
            
            // Simulate registration
            resultDiv.className = 'result-box show info';
            resultDiv.textContent = '⏳ Registering student... Please wait.';
            
            try {
                // In production, this would call your API
                // For demo, we'll simulate a successful registration
                
                // Check if student number already exists (simulated)
                const existingStudents = ['S2024001', 'S2024002'];
                if (existingStudents.includes(studentNumber)) {
                    resultDiv.className = 'result-box show error';
                    resultDiv.textContent = '⚠️ Student number already exists. Please check your number.';
                    return;
                }
                
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Success
                resultDiv.className = 'result-box show success';
                resultDiv.innerHTML = `
                    ✅ <strong>Registration Successful!</strong><br>
                    Student: ${firstName} ${lastName}<br>
                    Number: ${studentNumber}<br>
                    Programme: ${programme}<br>
                    Username: ${username}<br><br>
                    <span style="font-size:13px;color:#94a3b8;">
                        You can now login to track your academic progress and certificates.
                    </span>
                `;
                
                // Clear form
                document.getElementById('registrationForm').reset();
                
                // Disable submit button temporarily
                const submitBtn = document.querySelector('.btn-primary');
                submitBtn.textContent = '✅ Registered!';
                submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                setTimeout(() => {
                    submitBtn.textContent = '📝 Register Student';
                    submitBtn.style.background = '';
                }, 3000);
                
            } catch (error) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '❌ Registration failed: ' + error.message;
            }
        });
        
        // Live validation for username
        document.getElementById('username').addEventListener('input', function() {
            const username = this.value.trim();
            const resultDiv = document.getElementById('registrationResult');
            
            if (username && username.length > 0) {
                // Check if username is available (simulated)
                const takenUsernames = ['admin', 'system', 'registrar'];
                if (takenUsernames.includes(username.toLowerCase())) {
                    resultDiv.className = 'result-box show warning';
                    resultDiv.textContent = '⚠️ Username is not available. Please choose another.';
                } else {
                    resultDiv.className = 'result-box show success';
                    resultDiv.textContent = '✅ Username is available!';
                }
            }
        });
    </script>
</body>
</html>

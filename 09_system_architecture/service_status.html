<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Service Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #e0e7ff, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .service-card {
            background: rgba(30,41,59,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .service-card .name { font-weight: 600; }
        .service-card .port { color: #94a3b8; font-size: 13px; }
        .status-badge {
            padding: 4px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .status-online { background: rgba(16,185,129,0.15); color: #10b981; }
        .status-offline { background: rgba(239,68,68,0.15); color: #ef4444; }
        .status-checking { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .refresh-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.1); }
        .footer { text-align: center; color: #475569; font-size: 14px; margin-top: 30px; }
        .last-updated { color: #94a3b8; font-size: 13px; text-align: center; margin-top: 16px; }
    </style>
<script>
}
</script>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(15,23,42,0.8);border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:20px;">
        <div style="font-size:18px;font-weight:700;background:linear-gradient(135deg,#e0e7ff,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">🏛️ Certificate Ecosystem</div>
        <div style="display:flex;align-items:center;gap:12px;">
            <span id="userBadge" style="color:#94a3b8;font-size:13px;">👤 Loading...</span>
            <button onclick="logout()" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.2);padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-family:Inter,sans-serif;font-size:13px;">🚪 Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>🔍 Service Status</h1>
            <p style="color: #94a3b8;">Monitor all services in the Certificate Ecosystem</p>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <button class="refresh-btn" onclick="checkAllServices()">🔄 Refresh All</button>
        </div>

        <div id="servicesList"></div>

        <div class="last-updated" id="lastUpdated"></div>

        <div class="footer">
            🎓 University Certificate Ecosystem · All Rights Reserved
        </div>
    </div>

    <script>
        const services = [
            { name: 'Authentication Service', port: 8000, url: '/health' },
            { name: 'Certificate Service', port: 8001, url: '/health' },
            { name: 'Telemetry Service', port: 8002, url: '/health' },
            { name: 'PDF Service', port: 8003, url: '/health' },
            { name: 'Email Service', port: 8004, url: '/health' },
            { name: 'Dashboard Server', port: 9001, url: '/' }
        ];

        async function checkService(service) {
            try {
                const response = await fetch(`http://localhost:${service.port}${service.url}`, {
                    signal: AbortSignal.timeout(3000)
                });
                return response.ok;
            } catch {
                return false;
            }
        }

        async function checkAllServices() {
            const container = document.getElementById('servicesList');
            container.innerHTML = services.map(s => `
                <div class="service-card">
                    <div>
                        <div class="name">${s.name}</div>
                        <div class="port">Port ${s.port}</div>
                    </div>
                    <span class="status-badge status-checking">⏳ Checking...</span>
                </div>
            `).join('');

            let online = 0;
            for (let i = 0; i < services.length; i++) {
                const service = services[i];
                const isOnline = await checkService(service);
                if (isOnline) online++;
                
                const cards = container.querySelectorAll('.service-card');
                const badge = cards[i].querySelector('.status-badge');
                badge.className = `status-badge ${isOnline ? 'status-online' : 'status-offline'}`;
                badge.textContent = isOnline ? '✅ Online' : '❌ Offline';
            }

            document.getElementById('lastUpdated').textContent = `🕐 Last updated: ${new Date().toLocaleTimeString()} · ${online}/${services.length} services online`;
        }

        // Auto-check on load
        checkAllServices();

        // Auto-refresh every 30 seconds
        setInterval(checkAllServices, 30000);
    </script>
    <!-- Logout Component -->
    <script>addLogoutButton();</script>
</body>
</html>
<script>
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');
        window.location.href = 'login_with_rbac.html';
    }
}
function updateUserBadge() {
    try {
        const data = localStorage.getItem('user');
        if (data) {
            const user = JSON.parse(data);
            document.getElementById('userBadge').textContent = `👤 ${user.name || user.username}`;
        }
    } catch {}
}
document.addEventListener('DOMContentLoaded', updateUserBadge);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%);
        }
        .container { max-width: 480px; width: 100%; }
        .card {
            background: rgba(30,41,59,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 32px;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header .icon { font-size: 48px; display: block; margin-bottom: 8px; }
        .header h1 { font-size: 24px; font-weight: 800; color: #e2e8f0; }
        .header p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #94a3b8;
        }
        .form-control {
            width: 100%; padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white; font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .form-control:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-control::placeholder { color: #64748b; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.3s;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .result-box {
            margin-top: 16px; padding: 16px; border-radius: 10px;
            font-size: 14px; display: none; line-height: 1.5;
        }
        .result-box.show { display: block; }
        .result-box.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #10b981; }
        .result-box.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
        .result-box.info { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #818cf8; }
        .footer { text-align: center; color: #475569; font-size: 13px; margin-top: 16px; }
        .back-link { color: #818cf8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <span class="icon">🔑</span>
                <h1>Reset Password</h1>
                <p>Enter your email to receive password reset instructions</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input class="form-control" type="email" id="resetEmail" placeholder="Enter your university email" required>
                </div>
                <div class="form-group">
                    <label>Student Number</label>
                    <input class="form-control" type="text" id="resetStudentNumber" placeholder="Enter your student number" required>
                </div>
                <button type="submit" class="btn btn-primary">📧 Send Reset Instructions</button>
            </form>

            <div id="resetResult" class="result-box"></div>

            <div style="margin-top: 20px; text-align: center;">
                <a href="login_with_rbac.html" class="back-link">← Back to Login</a>
            </div>

            <div class="footer">🎓 Certificate Ecosystem · Password Recovery</div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value.trim();
            const studentNumber = document.getElementById('resetStudentNumber').value.trim();
            const resultDiv = document.getElementById('resetResult');
            
            if (!email || !studentNumber) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Please fill in all fields';
                return;
            }
            
            resultDiv.className = 'result-box show info';
            resultDiv.textContent = '⏳ Sending reset instructions...';
            
            try {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                resultDiv.className = 'result-box show success';
                resultDiv.innerHTML = `
                    ✅ <strong>Reset instructions sent!</strong><br>
                    We've sent password reset instructions to ${email}.<br>
                    Please check your inbox and follow the link to reset your password.
                    <br><br>
                    <span style="font-size:13px;color:#94a3b8;">
                        If you don't receive the email within 5 minutes, check your spam folder.
                    </span>
                `;
                
                document.getElementById('resetForm').reset();
                
            } catch (error) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '❌ Failed to send reset instructions: ' + error.message;
            }
        });
    </script>
</body>
</html>

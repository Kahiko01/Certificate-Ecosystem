<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 Department Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
            color: white;
        }
        .btn-primary { background: #6366f1; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; color: #0f172a; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .logout-btn {
            background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 6px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif; font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(239,68,68,0.25); transform: translateY(-2px); }
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(16px);
        }
        .card-title {
            font-size: 14px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 12px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block; margin-bottom: 3px; font-size: 11px; font-weight: 600; color: #94a3b8;
        }
        .form-control {
            width: 100%; padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: white; font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .form-control:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .table-wrap { overflow-x: auto; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 8px 10px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; background: #0f172a; }
        td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tr:hover { background: rgba(255,255,255,0.02); }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-info { background: rgba(99,102,241,0.15); color: #818cf8; }
        .badge-success { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-warning { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .barcode { font-family: 'Courier New', monospace; font-size: 12px; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
        .result-box {
            margin-top: 8px; padding: 10px 14px; border-radius: 8px;
            font-size: 12px; display: none; line-height: 1.5;
        }
        .result-box.show { display: block; }
        .result-box.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #10b981; }
        .result-box.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
        .result-box.info { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #818cf8; }
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .mt-8 { margin-top: 8px; }
        .text-muted { color: #94a3b8; font-size: 11px; }
        .text-center { text-align: center; }
        .dept-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .dept-registry { background: rgba(6,182,212,0.2); color: #22d3ee; }
        .dept-finance { background: rgba(16,185,129,0.2); color: #10b981; }
        .dept-dean { background: rgba(251,146,60,0.2); color: #fb923c; }
        .dept-academic { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .dept-accommodation { background: rgba(236,72,153,0.2); color: #f472b6; }
        .dept-discipline { background: rgba(239,68,68,0.2); color: #ef4444; }
        .dept-student { background: rgba(148,163,184,0.2); color: #94a3b8; }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 My Department Inventory</h1>
            <div class="header-right">
                <span id="userDisplay" style="color:#94a3b8;font-size:13px;">👤 Loading...</span>
                <span id="deptDisplay" style="color:#94a3b8;font-size:13px;"></span>
                <button class="btn btn-secondary btn-sm" onclick="refreshAll()">🔄</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid-3">
            <div class="card">
                <div style="text-align:center;padding:10px;">
                    <div style="font-size:28px;">📁</div>
                    <div style="font-weight:700;font-size:20px;" id="totalFiles">0</div>
                    <div style="font-size:12px;color:#94a3b8;">Total Files</div>
                </div>
            </div>
            <div class="card">
                <div style="text-align:center;padding:10px;">
                    <div style="font-size:28px;">✅</div>
                    <div style="font-weight:700;font-size:20px;" id="activeFiles">0</div>
                    <div style="font-size:12px;color:#94a3b8;">Active Files</div>
                </div>
            </div>
            <div class="card">
                <div style="text-align:center;padding:10px;">
                    <div style="font-size:28px;">📊</div>
                    <div style="font-weight:700;font-size:20px;" id="categoriesCount">0</div>
                    <div style="font-size:12px;color:#94a3b8;">Categories</div>
                </div>
            </div>
        </div>

        <!-- Add File -->
        <div class="card">
            <div class="card-title">📤 Add New File</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>File Name</label>
                    <input class="form-control" type="text" id="fileName" placeholder="Enter file name">
                </div>
                <div class="form-group">
                    <label>File Number</label>
                    <input class="form-control" type="text" id="fileNumber" placeholder="e.g., DOC-2026-001">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" id="fileCategory">
                        <option value="Documents">Documents</option>
                        <option value="Records">Records</option>
                        <option value="Reports">Reports</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input class="form-control" type="text" id="fileLocation" placeholder="e.g., Cabinet A, Shelf 2">
                </div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="addFile()">📁 Add File</button>
            <div id="addResult" class="result-box"></div>
        </div>

        <!-- Files Table -->
        <div class="card">
            <div class="card-title">📋 My Files <span class="sub" id="fileCount">0 files</span></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>File Name</th>
                            <th>File Number</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="filesTableBody">
                        <tr><td colspan="7" class="text-center text-muted">No files in this department</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ===== DEPARTMENT INVENTORY DATA =====
        // Each department has its own files - ONLY their department files
        const deptFiles = {
            'registry': [
                { name: 'Student Records 2024', number: 'REG-2024-001', category: 'Records', location: 'Cabinet R, Shelf 1', status: 'Active' },
                { name: 'Certificate Logs', number: 'REG-2024-002', category: 'Records', location: 'Cabinet R, Shelf 2', status: 'Active' },
                { name: 'Graduation Lists', number: 'REG-2024-003', category: 'Reports', location: 'Cabinet R, Shelf 3', status: 'Active' }
            ],
            'finance': [
                { name: 'Fee Payment Records', number: 'FIN-2024-001', category: 'Records', location: 'Cabinet F, Shelf 1', status: 'Active' },
                { name: 'Financial Reports', number: 'FIN-2024-002', category: 'Reports', location: 'Cabinet F, Shelf 2', status: 'Active' }
            ],
            'academic': [
                { name: 'Course Records', number: 'ACA-2024-001', category: 'Records', location: 'Cabinet A, Shelf 1', status: 'Active' },
                { name: 'Exam Results', number: 'ACA-2024-002', category: 'Records', location: 'Cabinet A, Shelf 2', status: 'Active' }
            ],
            'dean': [
                { name: 'Student Academic Records', number: 'DEAN-2024-001', category: 'Student Records', location: 'Cabinet D, Shelf 1', status: 'Active' },
                { name: 'Department Reports', number: 'DEAN-2024-002', category: 'Academic Reports', location: 'Cabinet D, Shelf 2', status: 'Active' },
                { name: 'Disciplinary Cases', number: 'DEAN-2024-003', category: 'Disciplinary', location: 'Cabinet D, Shelf 3', status: 'Active' }
            ],
            'accommodation': [
                { name: 'Hostel Records', number: 'ACC-2024-001', category: 'Records', location: 'Cabinet H, Shelf 1', status: 'Active' },
                { name: 'Room Allocations', number: 'ACC-2024-002', category: 'Records', location: 'Cabinet H, Shelf 2', status: 'Active' }
            ],
            'discipline': [
                { name: 'Case Files', number: 'DIS-2024-001', category: 'Records', location: 'Cabinet D, Shelf 1', status: 'Active' },
                { name: 'Disciplinary Reports', number: 'DIS-2024-002', category: 'Reports', location: 'Cabinet D, Shelf 2', status: 'Active' }
            ],
            'student': [
                { name: 'Personal Records', number: 'STU-2024-001', category: 'Records', location: 'Cabinet S, Shelf 1', status: 'Active' },
                { name: 'Academic Progress', number: 'STU-2024-002', category: 'Records', location: 'Cabinet S, Shelf 2', status: 'Active' }
            ]
        };

        const deptDisplayNames = {
            'registry': '📋 Registry',
            'finance': '💰 Finance',
            'academic': '📚 Academic',
            'dean': '🏫 Dean',
            'accommodation': '🏠 Accommodation',
            'discipline': '⚖️ Discipline',
            'student': '👨‍🎓 Student'
        };

        const deptBadgeClasses = {
            'registry': 'dept-registry',
            'finance': 'dept-finance',
            'academic': 'dept-academic',
            'dean': 'dept-dean',
            'accommodation': 'dept-accommodation',
            'discipline': 'dept-discipline',
            'student': 'dept-student'
        };

        function getUser() {
            try { const data = localStorage.getItem('user'); return data ? JSON.parse(data) : null; } catch { return null; }
        }

        function getUserRole() {
            const user = getUser();
            return user ? user.role : 'PUBLIC_VERIFIER';
        }

        function getDepartmentFromRole(role) {
            const map = {
                'REGISTRAR': 'registry',
                'REGISTRY_HEAD': 'registry',
                'REGISTRY_OFFICER': 'registry',
                'FINANCE_HEAD': 'finance',
                'FINANCE_OFFICER': 'finance',
                'ACADEMIC_HEAD': 'academic',
                'ACADEMIC_OFFICER': 'academic',
                'DEAN': 'dean',
                'ACCOMMODATION_HEAD': 'accommodation',
                'ACCOMMODATION_OFFICER': 'accommodation',
                'DISCIPLINE_HEAD': 'discipline',
                'DISCIPLINE_OFFICER': 'discipline',
                'STUDENT': 'student'
            };
            return map[role] || null;
        }

        function getFilesForDept(dept) {
            return deptFiles[dept] || [];
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = 'login_with_rbac.html';
            }
        }

        function refreshAll() {
            loadInventory();
        }

        function loadInventory() {
            const user = getUser();
            const role = getUserRole();
            const dept = getDepartmentFromRole(role);
            
            if (!dept) {
                document.getElementById('deptDisplay').textContent = '⚠️ No department assigned';
                document.getElementById('filesTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-muted">No department assigned to your account</td></tr>';
                document.getElementById('totalFiles').textContent = '0';
                document.getElementById('activeFiles').textContent = '0';
                document.getElementById('categoriesCount').textContent = '0';
                document.getElementById('fileCount').textContent = '0 files';
                return;
            }

            const files = getFilesForDept(dept);
            const displayName = deptDisplayNames[dept] || dept;
            const badgeClass = deptBadgeClasses[dept] || '';

            document.getElementById('deptDisplay').innerHTML = `<span class="dept-badge ${badgeClass}">${displayName}</span>`;
            document.getElementById('totalFiles').textContent = files.length;
            document.getElementById('activeFiles').textContent = files.filter(f => f.status === 'Active').length;
            
            const categories = new Set(files.map(f => f.category));
            document.getElementById('categoriesCount').textContent = categories.size;
            document.getElementById('fileCount').textContent = `${files.length} files`;

            const tbody = document.getElementById('filesTableBody');
            if (files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No files in this department</td></tr>';
                return;
            }

            tbody.innerHTML = files.map((file, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${file.name}</strong></td>
                    <td><span class="barcode">${file.number}</span></td>
                    <td><span class="badge badge-info">${file.category}</span></td>
                    <td>${file.location}</td>
                    <td><span class="badge badge-success">${file.status}</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editFile(${index})">✏️</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteFile(${index})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function addFile() {
            const name = document.getElementById('fileName').value.trim();
            const number = document.getElementById('fileNumber').value.trim();
            const category = document.getElementById('fileCategory').value;
            const location = document.getElementById('fileLocation').value.trim();
            const resultDiv = document.getElementById('addResult');

            const role = getUserRole();
            const dept = getDepartmentFromRole(role);

            if (!dept) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ No department assigned';
                return;
            }

            if (!name || !number || !location) {
                resultDiv.className = 'result-box show error';
                resultDiv.textContent = '⚠️ Please fill all fields';
                return;
            }

            if (!deptFiles[dept]) {
                deptFiles[dept] = [];
            }

            deptFiles[dept].push({
                name: name,
                number: number,
                category: category,
                location: location,
                status: 'Active'
            });

            loadInventory();
            document.getElementById('fileName').value = '';
            document.getElementById('fileNumber').value = '';
            document.getElementById('fileLocation').value = '';

            resultDiv.className = 'result-box show success';
            resultDiv.textContent = `✅ File "${name}" added!`;
            setTimeout(() => resultDiv.className = 'result-box', 3000);
        }

        function deleteFile(index) {
            const role = getUserRole();
            const dept = getDepartmentFromRole(role);
            if (!dept || !deptFiles[dept]) return;

            if (confirm('Delete this file?')) {
                deptFiles[dept].splice(index, 1);
                loadInventory();
            }
        }

        function editFile(index) {
            const role = getUserRole();
            const dept = getDepartmentFromRole(role);
            if (!dept || !deptFiles[dept] || !deptFiles[dept][index]) return;

            const file = deptFiles[dept][index];
            const newName = prompt('File Name:', file.name);
            if (newName) file.name = newName;
            const newNumber = prompt('File Number:', file.number);
            if (newNumber) file.number = newNumber;
            const newLocation = prompt('Location:', file.location);
            if (newLocation) file.location = newLocation;
            loadInventory();
        }

        function init() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login_with_rbac.html';
                return;
            }
            const user = getUser();
            document.getElementById('userDisplay').textContent = `👤 ${user ? user.name || user.username : 'User'}`;
            loadInventory();
        }

        init();
    </script>
</body>
</html>

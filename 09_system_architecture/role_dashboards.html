<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Role-Based Dashboard Access</title>
    <script src="rbac_system.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center; margin-bottom: 40px;
        }
        .header h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: #94a3b8; font-size: 16px; margin-top: 8px; }
        
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px; margin-top: 20px;
        }
        .dashboard-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #f8fafc;
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,102,241,0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .dashboard-card .icon { font-size: 40px; display: block; margin-bottom: 12px; }
        .dashboard-card .name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .dashboard-card .description { font-size: 14px; color: #94a3b8; margin-bottom: 12px; line-height: 1.5; }
        .dashboard-card .role-badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; margin: 2px;
        }
        .badge-any { background: rgba(99,102,241,0.15); color: #818cf8; }
        .badge-admin { background: rgba(239,68,68,0.15); color: #f87171; }
        .badge-registrar { background: rgba(6,182,212,0.15); color: #22d3ee; }
        .badge-finance { background: rgba(16,185,129,0.15); color: #34d399; }
        .badge-academic { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .badge-student { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .dashboard-card .locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .lock-icon { font-size: 16px; margin-left: 8px; }
        .user-role {
            background: rgba(0,0,0,0.3);
            padding: 12px 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .user-role .role { color: #818cf8; font-weight: 700; }
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
            margin-left: 12px;
        }
            background: rgba(239,68,68,0.25);
        }
        .flex { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 16px; }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(15,23,42,0.8);border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:20px;">
        <div style="font-size:18px;font-weight:700;background:linear-gradient(135deg,#e0e7ff,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">🏛️ Certificate Ecosystem</div>
        <div style="display:flex;align-items:center;gap:12px;">
            <span id="userBadge" style="color:#94a3b8;font-size:13px;">👤 Loading...</span>
            <button onclick="logout()" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.2);padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-family:Inter,sans-serif;font-size:13px;">🚪 Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>🎯 Role-Based Dashboard Access</h1>
            <p>Your role determines which dashboards you can access</p>
        </div>

        <div class="flex">
            <div class="user-role">
                👤 Logged in as: <span class="role" id="userName">Loading...</span>
                <span style="color: #94a3b8; margin: 0 8px;">·</span>
                Role: <span class="role" id="userRole">Loading...</span>
            </div>
        </div>

            <!-- Dashboards will be loaded here -->
        </div>
    </div>

    <script>
        // Get user from localStorage
        function getUserData() {
            const userData = localStorage.getItem('user');
            if (userData) {
                try {
                    return JSON.parse(userData);
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        function getUserRole() {
            const user = getUserData();
            return user ? user.role : 'STUDENT';
        }

        function getUserName() {
            const user = getUserData();
            if (user) {
                return `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.username || 'User';
            }
            return 'User';
        }

        // Dashboard definitions with role requirements
        const dashboards = [
            {
                id: 'unified',
                icon: '🏛️',
                name: 'Unified Dashboard',
                description: 'Central command center with all features in one place',
                roles: ['*'], // All roles
                url: 'unified_dashboard.html'
            },
            {
                id: 'finance',
                icon: '💰',
                description: 'Manage student fees, payments, and financial clearance',
                roles: ['SYSTEM_ADMIN', 'FINANCE_HEAD', 'FINANCE_OFFICER', 'REGISTRAR'],
                url: 'finance_dashboard.html'
            },
            {
                id: 'registry',
                icon: '📋',
                name: 'Registry Dashboard',
                description: 'Manage student records, registration, and academic tracking',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR', 'REGISTRY_HEAD', 'REGISTRY_OFFICER', 'ACADEMIC_HEAD'],
                url: 'registry_dashboard.html'
            },
            {
                id: 'academic',
                icon: '📚',
                name: 'Academic Dashboard',
                description: 'Academic performance, grades, and student progress tracking',
                roles: ['SYSTEM_ADMIN', 'ACADEMIC_HEAD', 'ACADEMIC_OFFICER', 'REGISTRAR', 'DEAN'],
                url: 'academic_dashboard.html'
            },
            {
                id: 'deans',
                icon: '🏛️',
                name: 'Dean\'s Dashboard',
                description: 'Department overview, faculty management, and performance analytics',
                roles: ['SYSTEM_ADMIN', 'DEAN', 'REGISTRAR'],
                url: 'deans_dashboard.html'
            },
            {
                id: 'login',
                icon: '🔐',
                name: 'Login Page',
                description: 'Secure login with role-based access control',
                roles: ['*'], // All roles
                url: 'login_with_rbac.html'
            },
            {
                id: 'monitoring',
                icon: '📊',
                name: 'Monitoring & Audit',
                description: 'Audit trail, user activity monitoring, and system metrics',
                roles: ['SYSTEM_ADMIN', 'REGISTRAR'],
                url: 'audit_monitoring_system.html'
            },
            {
                id: 'student',
                icon: '👨‍🎓',
                name: 'Student Dashboard',
                description: 'View your academic records, certificates, and clearance status',
                roles: ['SYSTEM_ADMIN', 'STUDENT'],
                url: 'student_dashboard.html'
            }
        ];

        function hasRoleAccess(role, allowedRoles) {
            if (allowedRoles.includes('*')) return true;
            return allowedRoles.includes(role);
        }

        function getRoleBadge(role) {
            const badgeMap = {
                'SYSTEM_ADMIN': 'badge-admin',
                'REGISTRAR': 'badge-registrar',
                'FINANCE_HEAD': 'badge-finance',
                'FINANCE_OFFICER': 'badge-finance',
                'ACADEMIC_HEAD': 'badge-academic',
                'ACADEMIC_OFFICER': 'badge-academic',
                'DEAN': 'badge-academic',
                'STUDENT': 'badge-student'
            };
            return badgeMap[role] || 'badge-any';
        }

        function renderDashboards() {
            const userRole = getUserRole();
            const userName = getUserName();
            
            document.getElementById('userName').textContent = userName;
            document.getElementById('userRole').textContent = userRole;

            const grid = document.getElementById('dashboardGrid');
            
            const availableDashboards = dashboards.filter(d => hasRoleAccess(userRole, d.roles));
            
            if (availableDashboards.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">
                        <p style="font-size: 48px; margin-bottom: 16px;">🔒</p>
                        <p>No dashboards available for your role.</p>
                        <p style="font-size: 13px; margin-top: 8px;">Contact your administrator for access.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = availableDashboards.map(d => {
                const badgeClass = getRoleBadge(userRole);
                return `
                    <a href="${d.url}" class="dashboard-card">
                        <span class="icon">${d.icon}</span>
                        <div class="name">${d.name}</div>
                        <div class="description">${d.description}</div>
                        <div>
                            <span class="role-badge ${badgeClass}">${userRole}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
        }

        // Check if user is logged in
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
            }
        }

        // Initialize
        checkAuth();
        renderDashboards();
    </script>
    <!-- Logout Component -->
    <script>addLogoutButton();</script>
</body>
</html>
<script>
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');
        window.location.href = 'login_with_rbac.html';
    }
}
function updateUserBadge() {
    try {
        const data = localStorage.getItem('user');
        if (data) {
            const user = JSON.parse(data);
            document.getElementById('userBadge').textContent = `👤 ${user.name || user.username}`;
        }
    } catch {}
}
document.addEventListener('DOMContentLoaded', updateUserBadge);
</script>

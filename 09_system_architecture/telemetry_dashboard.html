<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #e0e7ff, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .logout-btn {
            background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 6px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(239,68,68,0.25); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: rgba(30,41,59,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 20px; text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 800; color: #818cf8; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card {
            background: rgba(30,41,59,0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 20px;
        }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .chart-container { position: relative; height: 250px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.06); }
        td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-success { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-warning { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .badge-danger { background: rgba(239,68,68,0.15); color: #ef4444; }
        .footer { text-align: center; color: #475569; font-size: 14px; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.04); }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Telemetry & Monitoring Dashboard</h1>
            <div class="header-right">
                <span style="color:#94a3b8;font-size:13px;" id="userDisplay">👤 Admin</span>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="number" id="totalLogs">-</div><div class="label">Total Telemetry Events</div></div>
            <div class="stat-card"><div class="number" id="totalCerts">-</div><div class="label">Certificates Issued</div></div>
            <div class="stat-card"><div class="number" id="totalStudents">-</div><div class="label">Students</div></div>
            <div class="stat-card"><div class="number" id="systemUptime">-</div><div class="label">System Uptime</div></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-title">📈 Activity Trend</div>
                <div class="chart-container"><canvas id="activityChart"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">📊 Event Distribution</div>
                <div class="chart-container"><canvas id="eventChart"></canvas></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 Recent Telemetry Events</div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Time</th><th>Action</th><th>User</th><th>Resource</th><th>Status</th></tr></thead>
                    <tbody id="telemetryTable"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">📊 Telemetry & Monitoring · Real-time system insights</div>
    </div>

    <script>
        const TELEMETRY_URL = 'http://localhost:8002';
        const CERT_URL = 'http://172.26.80.1:8001';

        function getUser() {
            try {
                const data = localStorage.getItem('user');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function updateUserDisplay() {
            const user = getUser();
            if (user) {
                document.getElementById('userDisplay').textContent = `👤 ${user.name || user.username}`;
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = 'login_with_rbac.html';
            }
        }

        async function loadTelemetryData() {
            try {
                // Try to get telemetry data
                const response = await fetch(`${TELEMETRY_URL}/telemetry/stats`, {
                    signal: AbortSignal.timeout(3000)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalLogs').textContent = data.total_events || 0;
                    document.getElementById('totalCerts').textContent = data.certificates || 0;
                    document.getElementById('totalStudents').textContent = data.students || 0;
                    document.getElementById('systemUptime').textContent = data.uptime || 'N/A';
                }
            } catch (e) {
                console.log('Telemetry data not available yet');
            }

            // Load sample telemetry events for demo
            const events = [
                { time: new Date(Date.now() - 60000), action: 'CERTIFICATE_CREATED', user: 'system_admin', resource: 'S2024001', status: 'SUCCESS' },
                { time: new Date(Date.now() - 120000), action: 'LOGIN', user: 'registrar', resource: 'registry', status: 'SUCCESS' },
                { time: new Date(Date.now() - 180000), action: 'CERTIFICATE_VERIFIED', user: 'public', resource: 'CERT-2026-001', status: 'SUCCESS' },
                { time: new Date(Date.now() - 240000), action: 'LOGIN', user: 'dean', resource: 'deans', status: 'FAILED' },
                { time: new Date(Date.now() - 300000), action: 'CERTIFICATE_CREATED', user: 'registrar', resource: 'S2024002', status: 'SUCCESS' },
            ];

            const tbody = document.getElementById('telemetryTable');
            tbody.innerHTML = events.map(e => `
                <tr>
                    <td style="font-size:12px;color:#94a3b8;">${e.time.toLocaleTimeString()}</td>
                    <td><span class="badge badge-info">${e.action}</span></td>
                    <td>${e.user}</td>
                    <td>${e.resource}</td>
                    <td><span class="badge ${e.status === 'SUCCESS' ? 'badge-success' : 'badge-danger'}">${e.status}</span></td>
                </tr>
            `).join('');
        }

        // Charts
        function loadCharts() {
            // Activity Chart
            const ctx1 = document.getElementById('activityChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Events',
                        data: [12, 19, 15, 22, 18, 8, 5],
                        borderColor: '#818cf8',
                        backgroundColor: 'rgba(99,102,241,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // Event Distribution Chart
            const ctx2 = document.getElementById('eventChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Certificate Created', 'Login', 'Verification', 'Clearance', 'Other'],
                    datasets: [{
                        data: [45, 25, 15, 10, 5],
                        backgroundColor: ['#818cf8', '#34d399', '#f59e0b', '#f472b6', '#94a3b8'],
                        borderColor: '#0f172a',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true } }
                    },
                    cutout: '60%'
                }
            });
        }

        // Init
        updateUserDisplay();
        loadTelemetryData();
        loadCharts();

        // Refresh every 30 seconds
        setInterval(loadTelemetryData, 30000);
    </script>
</body>
</html>

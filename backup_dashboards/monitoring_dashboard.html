<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Monitoring & Audit Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
        }
        .header h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; padding: 20px; text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 800; color: #818cf8; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .charts-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;
        }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.06); }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .badge {
            padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-success { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-danger { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge-warning { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .badge-info { background: rgba(99,102,241,0.15); color: #818cf8; }
        .refresh-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.1); }
        .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mb-12 { margin-bottom: 12px; }
        .text-muted { color: #94a3b8; font-size: 13px; }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Monitoring & Audit Dashboard</h1>
            <div class="flex">
                <span class="text-muted" id="lastUpdate"></span>
                <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalLogs">-</div>
                <div class="label">Total Audit Logs</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayActivity">-</div>
                <div class="label">Today's Activity</div>
            </div>
            <div class="stat-card">
                <div class="number" id="activeUsers">-</div>
                <div class="label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="number" id="clearanceCount">-</div>
                <div class="label">Clearance Actions</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="card">
                <h3 style="margin-bottom:16px;">📈 Activity by Action</h3>
                <canvas id="actionChart"></canvas>
            </div>
            <div class="card">
                <h3 style="margin-bottom:16px;">👥 Top Users</h3>
                <canvas id="userChart"></canvas>
            </div>
        </div>

        <!-- Recent Logs -->
        <div class="card">
            <h3 style="margin-bottom:16px;">📋 Recent Audit Logs</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Resource</th>
                            <th>Status</th>
                            <th>IP</th>
                        </tr>
                    </thead>
                    <tbody id="logsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8002";
        let actionChart = null;
        let userChart = null;

        function refreshAll() {
            loadStats();
            loadAuditLogs();
            document.getElementById('lastUpdate').textContent = '🕐 Updated: ' + new Date().toLocaleTimeString();
        }

        function loadStats() {
            fetch(API + "/telemetry/stats")
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalLogs').textContent = data.total_audit_logs || 0;
                    document.getElementById('todayActivity').textContent = data.today_activity || 0;
                    document.getElementById('activeUsers').textContent = data.top_users?.length || 0;
                    document.getElementById('clearanceCount').textContent = data.clearance_stats?.length || 0;
                    
                    // Update charts
                    updateCharts(data);
                })
                .catch(() => {});
        }

        function updateCharts(data) {
            // Action Chart
            const ctx1 = document.getElementById('actionChart').getContext('2d');
            if (actionChart) actionChart.destroy();
            
            const actions = data.top_actions || [];
            actionChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: actions.map(a => a.action),
                    datasets: [{
                        label: 'Actions',
                        data: actions.map(a => a.count),
                        backgroundColor: '#818cf8',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // User Chart
            const ctx2 = document.getElementById('userChart').getContext('2d');
            if (userChart) userChart.destroy();
            
            const users = data.top_users || [];
            const colors = ['#818cf8', '#34d399', '#f59e0b', '#f472b6', '#06b6d4'];
            userChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: users.map(u => u.username),
                    datasets: [{
                        data: users.map(u => u.actions),
                        backgroundColor: colors.slice(0, users.length),
                        borderColor: '#0f172a',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { padding: 12, usePointStyle: true } }
                    },
                    cutout: '60%'
                }
            });
        }

        function loadAuditLogs() {
            fetch(API + "/telemetry/audit?limit=20")
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('logsTable');
                    if (!data.logs || data.logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px;">No logs found</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = data.logs.map(log => `
                        <tr>
                            <td style="font-size:12px;color:#94a3b8;">${new Date(log.created_at).toLocaleTimeString()}</td>
                            <td>${log.username || 'Unknown'}</td>
                            <td><span class="badge badge-info">${log.action}</span></td>
                            <td>${log.resource_type}</td>
                            <td><span class="badge ${log.status === 'SUCCESS' ? 'badge-success' : 'badge-danger'}">${log.status}</span></td>
                            <td style="font-size:12px;color:#94a3b8;">${log.ip_address || '-'}</td>
                        </tr>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('logsTable').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#ef4444;padding:20px;">Error loading logs</td></tr>';
                });
        }

        // Auto-refresh every 30 seconds
        refreshAll();
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>

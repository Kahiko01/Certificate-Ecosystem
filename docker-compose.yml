# ============================================
# CERTIFICATE ECOSYSTEM - Docker Compose
# Complete Certificate & Record Management System
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: certificate-postgres
    environment:
      POSTGRES_DB: certificate_ecosystem
      POSTGRES_USER: cert_admin
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./08_database_design/simple_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./08_database_design/clearance_schema.sql:/docker-entrypoint-initdb.d/02_clearance.sql
      - ./08_database_design/rbac_schema.sql:/docker-entrypoint-initdb.d/03_rbac.sql
    networks:
      - certificate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cert_admin -d certificate_ecosystem"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: certificate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - certificate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    command: python3 09_system_architecture/auth_service.py
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://cert_admin:secure_password_123@postgres:5432/certificate_ecosystem
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - certificate-network
    restart: unless-stopped

  # Certificate Service
  certificate-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate-service
    command: python3 09_system_architecture/simple_service.py
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cert_admin:secure_password_123@postgres:5432/certificate_ecosystem
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - certificate-network
    restart: unless-stopped

  # Dashboard Server
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate-dashboard
    command: python3 -m http.server 9001 --bind 0.0.0.0
    ports:
      - "9001:9001"
    working_dir: /app/09_system_architecture
    depends_on:
      - auth-service
    networks:
      - certificate-network
    restart: unless-stopped

networks:
  certificate-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
